<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🎂Happy Birthday🎂</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ================= NHẠC ================= -->

    <audio id="bgMusic">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <button id="musicBtn" onclick="toggleMusic()">
        🎵 Nhạc: ON
    </button>


    <!-- ================= CONTAINER ================= -->

    <div class="container">


        <!-- ================= TIÊU ĐỀ ================= -->

        <h1 class="birthday-title">

            <span>🎂</span>

            <span>Happy Birthday</span>

            <span>🎂</span>

        </h1>


        <!-- ================= PHỤ ĐỀ ================= -->

        <p class="subtitle">
            Một món quà nhỏ dành cho cậu 💌
        </p>


        <!-- ================= HỘP QUÀ ================= -->

        <div id="giftBox" onclick="showGift()">
            🎁
        </div>

        <p id="guide">
            Nhấn vào hộp quà để mở nhé ✨
        </p>


        <!-- ================= MÓN QUÀ ================= -->

        <div id="gift">

            <img
                id="catGift"
                src="images/cat.png"
                alt="Mèo"
            >

            <h2>
                Dành tặng cậu 🌷
            </h2>

            <button
                id="letterBtn"
                onclick="showLetter()"
            >
                Đọc thư 💌
            </button>

        </div>


        <!-- ================= LÁ THƯ ================= -->

        <div
            id="letter"
            onclick="openLetter()"
        >
            💌
        </div>

        <p id="letterGuide">
            Nhấn vào lá thư nhé 💖
        </p>


        <!-- ================= LỜI CHÚC CHẠY CHỮ ================= -->

        <div id="message"></div>


        <!-- ================= KẾT THÚC ================= -->

        <div id="endMessage">

            💗 Cảm ơn cậu đã mở món quà này 💗

            <br><br>

            <button onclick="restartPage()">
                🔄 Xem lại từ đầu
            </button>

        </div>


    </div>


    <!-- ================= CONFETTI ================= -->

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>


</body>

</html>
