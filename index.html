<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🎂Happy Birthday🎂</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Nhạc -->
    <audio id="bgMusic">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div class="container">

        <h1>🎂Happy Birthday🎂</h1>

        <p class="subtitle">
            Một món quà nhỏ dành cho cậu 💌
        </p>

        <!-- Hộp quà -->
         <div id="giftBox" onclick="showGift()">
            🎁
        </div>

        <p id="guide">
            Nhấn vào hộp quà để mở nhé ✨
        </p>

        <!-- Mèo -->
        <div id="gift">

            <img id="catGift" src="images/cat.png" alt="Mèo">

            <h2>Dành tặng cậu 🌷</h2>

            <button id="letterBtn" onclick="showLetter()">
                Đọc thư 💌
            </button>

        </div>

        <!-- Lá thư -->

        <div id="letter" onclick="openLetter()">
            💌
        </div>

        <p id="letterGuide">
            Nhấn vào lá thư nhé 💖
        </p>

        <!-- Lời chúc -->

        <p id="message"></p>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <script src="script.js"></script>

</body>

</html>
